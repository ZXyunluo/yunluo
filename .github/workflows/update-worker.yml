name: Auto Update Worker

# 触发条件配置
on:
  push:
    branches:
      - main  # main分支推送代码时自动执行
  schedule:
    - cron: "0 1 * * *" # 定时任务：每天凌晨1点自动运行
  workflow_dispatch:
    inputs:
      update_latest:
        description: '是否手动更新 v4.2.3版本？'
        required: false
        default: 'false'

# 工作流权限：授予仓库读写权限，用于提交推送代码
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest # 使用Ubuntu最新虚拟机环境运行任务
    steps:
      # 拉取当前仓库代码到运行环境
      - name: 初始化仓库
        uses: actions/checkout@v4

      # 读取本地保存的版本号，记录到环境变量
      - name: 获取当前本地版本
        id: get_local_version
        run: |
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(cat version.txt)
          else
            LOCAL_VERSION=""
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV

      # 请求GitHub API，获取固定v4.2.3版本worker.zip下载地址
      - name: 获取固定v4.2.3版本信息
        id: get_release
        run: |
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases"
          RESPONSE=$(curl -s "$API_URL")

          # 锁定目标版本标签，与上游tag完全一致 v4.2.3
          TARGET_TAG="v4.2.3"
          # 筛选tag=v4.2.3的发布，取出worker.zip下载链接
          TARGET_DOWNLOAD=$(echo "$RESPONSE" | jq -r ".[] | select(.tag_name==\"$TARGET_TAG\") | .assets[] | select(.name==\"worker.zip\") | .browser_download_url")

          # 校验下载链接是否有效，找不到资源直接终止任务
          if [ -z "$TARGET_DOWNLOAD" ] || [ "$TARGET_DOWNLOAD" = "null" ]; then
            echo "❌ 错误：未找到版本 $TARGET_TAG 的 worker.zip 资源！核对版本标签"
            exit 1
          fi

          # 写入全局环境变量，供后续步骤调用
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "TARGET_DOWNLOAD=$TARGET_DOWNLOAD" >> $GITHUB_ENV

          echo "锁定更新目标版本: $TARGET_TAG"

      # 【定时自动更新逻辑】对比本地版本与目标版本，版本一致跳过更新
      - name: 判断是否需要自动更新到v4.2.3
        id: check_update
        run: |
          if [ "$LOCAL_VERSION" = "$TARGET_TAG" ]; then
            # 当前已经是v4.2.3，自动更新流程跳过
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            echo "当前已是 $TARGET_TAG 版本，自动更新无需执行"
          else
            # 版本不一致，标记需要更新
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            echo "准备自动更新至目标版本 $TARGET_TAG"
          fi

      # 执行自动更新：清空仓库文件、下载并解压v4.2.3安装包
      # 仅当判定需要更新时执行（仅定时/推送触发生效）
      - name: 自动更新至v4.2.3
        if: env.UPDATE_NEEDED == 'true'
        run: |
          # 兼容写法，删除除.git文件夹以外所有文件，替代不稳定的extglob
          find . -mindepth 1 ! -path ./.git\* -delete
          wget -O worker.zip "$TARGET_DOWNLOAD" # 下载安装包
          unzip -o worker.zip # 覆盖解压
          rm worker.zip # 删除压缩包
          echo "$TARGET_TAG" > version.txt # 写入当前版本记录文件

      # 自动提交变更并强制推送回仓库
      - name: 提交自动更新变更
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步固定版本 Worker：${{ env.TARGET_TAG }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: --force # 强制推送

      # 【手动触发逻辑】不受版本检测限制，只要输入true就强制重装v4.2.3
      - name: 手动强制更新v4.2.3（忽略本地版本检测）
        if: ${{ github.event.inputs.update_latest == 'true' }}
        run: |
          echo "手动调度触发，强制重装目标版本 $TARGET_TAG，跳过版本判断"
          # 复用API查询v4.2.3下载地址
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases"
          RESPONSE=$(curl -s "$API_URL")
          TARGET_DOWNLOAD=$(echo "$RESPONSE" | jq -r ".[] | select(.tag_name==\"$TARGET_TAG\") | .assets[] | select(.name==\"worker.zip\") | .browser_download_url")
          find . -mindepth 1 ! -path ./.git\* -delete
          wget -O worker.zip "$TARGET_DOWNLOAD"
          unzip -o worker.zip
          rm worker.zip
          echo "$TARGET_TAG" > version.txt
          # 配置git提交用户信息
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔄 手动触发同步固定版本 Worker：$TARGET_TAG"
          git push --force
