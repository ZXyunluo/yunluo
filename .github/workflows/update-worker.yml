name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:
    inputs:
      update_latest:
        description: '是否手动更新 Latest 正式版？'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 初始化仓库
        uses: actions/checkout@v4

      - name: 获取当前本地版本
        id: get_local_version
        run: |
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(cat version.txt)
          else
            LOCAL_VERSION=""
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV

      - name: 固定获取 v4.2.3 版本信息
        id: get_release
        run: |
          # 直接请求指定tag v4.2.3，不再遍历所有release
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/tags/v4.2.3"
          RESPONSE=$(curl -s "$API_URL")

          TARGET_TAG="v4.2.3"
          # 提取该版本下worker.zip下载链接
          TARGET_DOWNLOAD=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name=="worker.zip") | .browser_download_url')

          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "TARGET_DOWNLOAD=$TARGET_DOWNLOAD" >> $GITHUB_ENV

          echo "锁定目标版本: $TARGET_TAG"
          echo "文件下载地址: $TARGET_DOWNLOAD"

      - name: 判断是否需要更新
        id: check_update
        run: |
          if [ "$LOCAL_VERSION" = "$TARGET_TAG" ]; then
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            echo "已经是目标版本 $TARGET_TAG，无需更新"
          else
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            echo "当前版本不一致，准备更新至 $TARGET_TAG"
          fi

      - name: 更新至 v4.2.3
        if: env.UPDATE_NEEDED == 'true'
        run: |
          shopt -s extglob
          rm -rf !( .git )
          wget -O worker.zip "$TARGET_DOWNLOAD"
          unzip -o worker.zip
          rm worker.zip
          echo "$TARGET_TAG" > version.txt

      - name: 提交更新
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步固定版本 Worker：${{ env.TARGET_TAG }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: --force

      # 如果你仍然想保留原来手动更新Latest的入口（可选，不需要直接删除下面整块）
      - name: 手动更新 Latest
        if: ${{ github.event.inputs.update_latest == 'true' }}
        run: |
          echo "开始手动更新 Latest 正式版"
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/latest"
          RESPONSE=$(curl -s "$API_URL")
          LATEST_TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          LATEST_DOWNLOAD=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name=="worker.zip") | .browser_download_url')
          shopt -s extglob
          rm -rf !( .git )
          wget -O worker.zip "$LATEST_DOWNLOAD"
          unzip -o worker.zip
          rm worker.zip
          echo "$LATEST_TAG" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔄 手动同步 Latest Worker：$LATEST_TAG"
          git push --force
