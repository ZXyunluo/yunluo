name: Auto Update Worker

# 触发条件配置
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:
    inputs:
      update_latest:
        description: '是否手动强制更新 v4.2.3（忽略本地版本）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - name: 初始化仓库
        uses: actions/checkout@v4

      # 读取本地版本记录
      - name: 获取当前本地版本
        id: get_local_version
        run: |
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(cat version.txt)
          else
            LOCAL_VERSION=""
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV
          echo "本地版本：$LOCAL_VERSION"

      # 硬编码固定v4.2.3资源信息，不再请求API
      - name: 载入固定v4.2.3资源信息
        run: |
          export TARGET_TAG="v4.2.3"
          export DOWNLOAD_URL="https://github.com/bia-pain-bache/BPB-Worker-Panel/releases/download/v4.2.3/worker.zip"
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "锁定目标版本：$TARGET_TAG"

      # 自动更新判断逻辑
      - name: 判断自动更新条件
        id: check_auto_update
        run: |
          if [ "$LOCAL_VERSION" = "$TARGET_TAG" ]; then
            echo "AUTO_UPDATE_REQUIRED=false" >> $GITHUB_ENV
            echo "✅ 当前已是v4.2.3，自动更新跳过"
          else
            echo "AUTO_UPDATE_REQUIRED=true" >> $GITHUB_ENV
            echo "⚠️ 版本不一致，执行自动更新"
          fi

      # 自动更新执行
      - name: 自动更新至 v4.2.3
        if: env.AUTO_UPDATE_REQUIRED == 'true'
        run: |
          find . -mindepth 1 ! -path ./.git\* -delete
          wget -O worker.zip "${{ env.DOWNLOAD_URL }}"
          unzip -o worker.zip
          rm worker.zip
          echo "${{ env.TARGET_TAG }}" > version.txt

      # 自动提交推送（使用官方action，内置空变更容错）
      - name: 提交自动更新变更
        if: env.AUTO_UPDATE_REQUIRED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步固定版本 Worker：${{ env.TARGET_TAG }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: --force

      # 手动强制更新（update_latest=true 生效，增加变更检测）
      - name: 手动强制更新 v4.2.3
        if: ${{ github.event.inputs.update_latest == 'true' }}
        run: |
          echo "🔧 手动触发，强制重装 ${{ env.TARGET_TAG }}"
          find . -mindepth 1 ! -path ./.git\* -delete
          wget -O worker.zip "${{ env.DOWNLOAD_URL }}"
          unzip -o worker.zip
          rm worker.zip
          echo "${{ env.TARGET_TAG }}" > version.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # 检测是否存在文件变更，无变更直接退出，不执行commit
          if git diff --cached --quiet; then
            echo "ℹ️ 文件无变化，无需提交，任务正常结束"
            exit 0
          fi
          git commit -m "🔄 手动触发同步固定版本 Worker：${{ env.TARGET_TAG }}"
          git push --force
