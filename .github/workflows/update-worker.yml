name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:
    inputs:
      update_latest:
        description: '是否手动更新 Latest 正式版？'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 初始化仓库
        uses: actions/checkout@v4

      - name: 获取当前本地版本
        id: get_local_version
        run: |
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(cat version.txt)
          else
            LOCAL_VERSION=""
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV

      - name: 获取固定版本 v4.2.3 资源
        id: get_target_release
        run: |
          # 直接请求 v4.2.3 指定tag release
          TAG="v4.2.3"
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/tags/${TAG}"
          RESPONSE=$(curl -s "$API_URL")

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name=="worker.zip") | .browser_download_url')

          echo "TARGET_TAG=${TAG}" >> $GITHUB_ENV
          echo "TARGET_DOWNLOAD=$DOWNLOAD_URL" >> $GITHUB_ENV

          echo "目标锁定版本：${TAG}"
          echo "worker.zip 下载链接：$DOWNLOAD_URL"

      - name: 判断是否需要更新至 v4.2.3
        id: check_update
        run: |
          if [[ "$LOCAL_VERSION" == "$TARGET_TAG" ]]; then
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            echo "本地已是 v4.2.3，无需更新"
          else
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            echo "本地版本不一致，将更新到 v4.2.3"
          fi

      - name: 下载并部署 v4.2.3
        if: env.UPDATE_NEEDED == 'true'
        run: |
          shopt -s extglob
          rm -rf !( .git )
          wget -O worker.zip "$TARGET_DOWNLOAD"
          unzip -o worker.zip
          rm worker.zip
          echo "$TARGET_TAG" > version.txt

      - name: 提交 v4.2.3 更新
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步固定版本 Worker：${{ env.TARGET_TAG }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: --force

      - name: 手动更新 Latest 正式版
        if: ${{ github.event.inputs.update_latest == 'true' }}
        run: |
          echo "开始手动拉取最新正式版"
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/latest"
          RESPONSE=$(curl -s "$API_URL")
          LATEST_TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          LATEST_DOWNLOAD=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name=="worker.zip") | .browser_download_url')

          shopt -s extglob
          rm -rf !( .git )
          wget -O worker.zip "$LATEST_DOWNLOAD"
          unzip -o worker.zip
          rm worker.zip
          echo "$LATEST_TAG" > version.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔄 手动同步 Latest Worker：$LATEST_TAG"
          git push --force
